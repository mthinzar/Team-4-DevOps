# ============================================================
#  Local stack + production deploy target, from one file.
#
#    docker compose up -d mongo        # just the database
#    docker compose up app             # app on :3000 (start mongo first)
#    docker compose run --rm tests     # full suite against a clean DB
#
#  The `tests` service exists so nobody has to install Mongo locally
#  to run the integration suite.
#
#  In production, deploy.yml (Ansible) writes a real .env with the
#  Atlas MONGODB_URI/SESSION_SECRET and runs
#  `docker compose up -d --build app` — Compose auto-loads that .env
#  for the ${...} defaults below, so the same file serves both
#  local dev and production without a -f override or a second copy
#  of this file. `app` has no depends_on so scoping to it in
#  production never drags up a throwaway local `mongo` container.
# ============================================================

services:
  mongo:
    image: mongo:7
    container_name: foodhub-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    container_name: foodhub-app
    ports:
      - '${HOST_PORT:-3000}:3000'
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/foodhub}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret}
      PORT: '3000'
    restart: unless-stopped
    volumes:
      - foodhub_uploads:/app/public/images/uploads

  # Runs the suite inside the same network as mongo. Uses the plain
  # node image with a bind mount so a code change needs no rebuild.
  tests:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      MONGODB_URI: mongodb://mongo:27017/foodhub
      SESSION_SECRET: compose-test-secret
    depends_on:
      mongo:
        condition: service_healthy
    command: sh -c "npm ci && npm run seed && npm run test:unit && npm run test:integration"

volumes:
  mongo-data:
  foodhub_uploads:
